name: Refresh GitHub contributions

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contributions-refresh.yml'
      - 'scripts/fetch-github-contributions.mjs'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: github-contributions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch contributions
        env:
          GH_CONTRIBUTIONS_GRAPH_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_GRAPH_TOKEN }}
        run: node scripts/fetch-github-contributions.mjs

      - name: Open and merge PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/github-contributions.json
          if git diff --staged --quiet; then
            echo "No contribution data changes."
            exit 0
          fi

          BRANCH="chore/github-contributions"
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          git add public/data/github-contributions.json
          git commit -m "chore: refresh github contribution calendar"
          git push -u origin "HEAD:$BRANCH" --force

          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: refresh github contribution calendar" \
              --body "Automated refresh of \`public/data/github-contributions.json\`.")
            PR=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          fi

          echo "Merging PR #$PR"
          gh pr merge "$PR" --squash --delete-branch
